# Local Minikube Override Values
# Use this file for local development customization
# Deploy with: helm install todo-chatbot . -f values-local.yaml

# Update these with your actual values

backend:
  env:
    # Add your OpenAI API key here
    OPENAI_API_KEY: "sk-your-openai-api-key-here"

    # Customize JWT secret (min 32 characters)
    JWT_SECRET: "your-custom-secret-key-min-32-characters-here"

    # Optional: Change OpenAI model
    OPENAI_MODEL: "gpt-4"

    # Optional: Adjust timeouts
    AGENT_TIMEOUT: "30"
    CONTEXT_WINDOW_SIZE: "20"

  # Optional: Adjust resources for local testing
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

frontend:
  env:
    # Update these after getting Minikube IP (minikube ip)
    NEXT_PUBLIC_API_URL: "http://192.168.49.2:30800"
    BETTER_AUTH_URL: "http://192.168.49.2:30300"

    # Optional: Use same JWT secret as backend
    JWT_SECRET: "your-custom-secret-key-min-32-characters-here"

  # Optional: Adjust resources for local testing
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

postgres:
  # Optional: Increase storage for development
  persistence:
    size: 2Gi

  # Optional: Adjust resources
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

# Optional: Enable if you have metrics-server
autoscaling:
  enabled: false
