apiVersion: v1
kind: Secret
metadata:
  name: {{ include "todo-chatbot.fullname" . }}-secret
  labels:
    {{- include "todo-chatbot.labels" . | nindent 4 }}
type: Opaque
stringData:
  # PostgreSQL Password
  POSTGRES_PASSWORD: {{ .Values.postgres.env.POSTGRES_PASSWORD | quote }}

  # Backend Secrets
  JWT_SECRET: {{ .Values.backend.env.JWT_SECRET | quote }}
  OPENAI_API_KEY: {{ .Values.backend.env.OPENAI_API_KEY | quote }}

  # Frontend Secrets
  BETTER_AUTH_SECRET: {{ .Values.frontend.env.BETTER_AUTH_SECRET | quote }}
