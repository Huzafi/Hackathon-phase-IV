apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "todo-chatbot.fullname" . }}-config
  labels:
    {{- include "todo-chatbot.labels" . | nindent 4 }}
data:
  # PostgreSQL Configuration
  POSTGRES_USER: {{ .Values.postgres.env.POSTGRES_USER | quote }}
  POSTGRES_DB: {{ .Values.postgres.env.POSTGRES_DB | quote }}

  # Backend Configuration
  JWT_ALGORITHM: {{ .Values.backend.env.JWT_ALGORITHM | quote }}
  JWT_EXPIRATION_HOURS: {{ .Values.backend.env.JWT_EXPIRATION_HOURS | quote }}
  OPENAI_MODEL: {{ .Values.backend.env.OPENAI_MODEL | quote }}
  AGENT_TIMEOUT: {{ .Values.backend.env.AGENT_TIMEOUT | quote }}
  CONTEXT_WINDOW_SIZE: {{ .Values.backend.env.CONTEXT_WINDOW_SIZE | quote }}
